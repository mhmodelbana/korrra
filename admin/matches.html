<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoraMatch | إدارة المباريات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            neon: '#00ff87'
                        },
                        dark: {
                            base: '#0b0f17',
                            card: '#131b29',
                            border: '#1f293d',
                            hover: '#1a2436'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen bg-dark-base">
    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 glass-panel border-b border-dark-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-neon flex items-center justify-center text-black font-black text-2xl shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-wider text-white">ملعبنا<span class="text-brand-500">.</span></span>
                    <p class="text-xs text-gray-400 font-medium hidden sm:block">إدارة المباريات</p>
                </div>
            </div>

            <!-- Admin Menu -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-home text-brand-500"></i>
                    <span>الرئيسية</span>
                </a>
                <a href="requests.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-user-check text-brand-500"></i>
                    <span>الطلبات</span>
                </a>
                <a href="players.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-users text-brand-500"></i>
                    <span>اللاعبين</span>
                </a>
                <a href="payments.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-money-bill-wave text-brand-500"></i>
                    <span>المدفوعات</span>
                </a>
                <button id="logout-btn" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-400 px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-brand-500"></i>
                    <span>إدارة المباريات</span>
                </h2>
                <p class="text-xs text-gray-400 mt-1">إنشاء وإدارة مباريات الملاعب</p>
            </div>

            <button id="create-match-btn" class="bg-brand-500 hover:bg-brand-400 text-black font-extrabold px-6 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-brand-500/20">
                <i class="fa-solid fa-plus-circle"></i>
                <span>إضافة مباراة جديدة</span>
            </button>
        </div>

        <!-- Matches Grid -->
        <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic content -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16 glass-panel rounded-3xl border border-dark-border">
            <div class="w-16 h-16 bg-dark-hover text-gray-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-futbol font-normal"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">لا توجد مباريات</h3>
            <p class="text-sm text-gray-400 mb-4">ابدأ بإنشاء مباراة جديدة</p>
        </div>
    </main>

    <!-- Create Match Modal -->
    <div id="create-match-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
        <div class="glass-panel border border-dark-border w-full max-w-xl rounded-3xl p-6 sm:p-8 relative shadow-2xl">
            <button id="close-modal-btn" class="absolute top-6 left-6 text-gray-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-brand-500/20 border border-brand-500/30 flex items-center justify-center text-brand-500 font-bold">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div>
                    <h3 class="text-xl font-black text-white">إضافة مباراة جديدة</h3>
                    <p class="text-xs text-gray-400">أدخل تفاصيل المباراة</p>
                </div>
            </div>

            <form id="create-match-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1.5">عنوان المباراة</label>
                    <input type="text" id="match-title" required placeholder="مثال: خماسي السبت الناري" class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1.5">اسم الملعب</label>
                        <input type="text" id="pitch-name" required placeholder="مثال: ملعب النادي الأهلي" class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1.5">تاريخ المباراة</label>
                        <input type="date" id="match-date" required class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1.5">وقت البداية</label>
                        <input type="time" id="start-time" required class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1.5">وقت الانتهاء</label>
                        <input type="time" id="end-time" required class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1.5">التكلفة الإجمالية (جنيه)</label>
                        <input type="number" id="total-cost" min="1" required placeholder="1000" class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1.5">العدد الأقصى للاعبين</label>
                        <input type="number" id="max-players" min="2" max="22" required placeholder="10" class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1.5">ملاحظات (اختياري)</label>
                    <textarea id="notes" rows="2" placeholder="أي ملاحظات إضافية..." class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500"></textarea>
                </div>

                <div class="pt-4 flex items-center justify-end gap-3">
                    <button type="button" id="cancel-btn" class="px-5 py-2.5 rounded-xl border border-dark-border text-gray-400 hover:text-white text-sm font-bold">إلغاء</button>
                    <button type="submit" class="bg-brand-500 hover:bg-brand-400 text-black font-extrabold px-6 py-2.5 rounded-xl text-sm transition">حفظ ونشر المباراة</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
    import { Auth } from '../js/auth.js';
    import { MatchService } from '../js/services/match-service.js';
    import { RequestService } from '../js/services/request-service.js';
    import { UI } from '../js/ui.js';

    Auth.init();

   let allMatches = [];
let allMatchPlayers = [];
let countdownInterval = null;

    // =========================
    // Load Matches
    // =========================
    async function loadMatches() {
        try {
            const isAdmin = await Auth.requireAdmin();

            if (!isAdmin) {
                return;
            }

            UI.showLoading(
                'matches-grid',
                'جاري تحميل المباريات...'
            );

            allMatches = await MatchService.getAllMatches();
allMatchPlayers = await RequestService.getAllMatchPlayers();

await renderMatches();

        } catch (error) {
            console.error('Error loading matches:', error);

            UI.showError(
                'matches-grid',
                'حدث خطأ أثناء تحميل المباريات'
            );
        }
    }

    // =========================
    // Render Matches
    // =========================
    async function renderMatches() {

    const grid = document.getElementById('matches-grid');
    const emptyState = document.getElementById('empty-state');

    if (!allMatches || allMatches.length === 0) {

        grid.innerHTML = '';
        emptyState.classList.remove('hidden');

        return;
    }

    emptyState.classList.add('hidden');

    grid.innerHTML = allMatches.map(match => {

        const matchPlayers = allMatchPlayers.filter(
            player => player.match_id === match.id
        );

        const approvedPlayers = matchPlayers.filter(
            player => player.status === 'approved'
        );

        const pendingPlayers = matchPlayers.filter(
            player => player.status === 'pending'
        );

        const approvedCount = approvedPlayers.length;
        const pendingCount = pendingPlayers.length;

        const maxPlayers = Number(match.max_players || 0);
        const totalCost = Number(match.total_cost || 0);

        const remainingSpots = Math.max(
            0,
            maxPlayers - approvedCount
        );

        const isFull = approvedCount >= maxPlayers;

        const matchStart = new Date(
            `${match.match_date}T${match.start_time}`
        );

        const hasStarted = new Date() >= matchStart;

        const bookingClosed = isFull || hasStarted;

let matchStatusText = 'الحجز مفتوح';
let matchStatusClass = 'bg-brand-500/10 text-brand-500 border-brand-500/30';
let matchStatusIcon = 'fa-door-open';

if (hasStarted) {
    matchStatusText = 'المباراة بدأت';
    matchStatusClass = 'bg-blue-500/10 text-blue-400 border-blue-500/30';
    matchStatusIcon = 'fa-play';
} else if (isFull) {
    matchStatusText = 'المباراة مكتملة';
    matchStatusClass = 'bg-red-500/10 text-red-400 border-red-500/30';
    matchStatusIcon = 'fa-lock';
}

        const costPerPlayer =
            MatchService.calculatePlayerShare(
                totalCost,
                approvedCount
            );

        return `
            <div
                class="glass-panel rounded-3xl p-6 border border-dark-border hover:border-brand-500/40 transition-all duration-300 flex flex-col justify-between group"
            >

                <!-- Header -->
                <div class="flex items-start justify-between gap-2 mb-3">

                    <span
                        class="bg-brand-500/10 text-brand-500 border border-brand-500/30 text-xs px-3 py-1 rounded-full font-bold"
                    >
                        <i class="fa-solid fa-shield-halved ml-1"></i>
                        ${escapeHtml(match.pitch_name)}
                    </span>

                    <span
                        class="text-xs px-2.5 py-1 rounded-lg font-bold ${
                            isFull
                                ? 'bg-red-500/10 text-red-400 border border-red-500/30'
                                : 'bg-dark-hover text-gray-300 border border-dark-border'
                        }"
                    >
                        ${approvedCount} / ${maxPlayers} لاعبين
                    </span>

                </div>


                <!-- Title -->
<div class="flex items-start justify-between gap-3 mb-4">
    <h3 class="text-xl font-black text-white">
        ${escapeHtml(match.title)}
    </h3>

    <span class="shrink-0 ${matchStatusClass} border px-2.5 py-1 rounded-lg text-[10px] font-bold flex items-center gap-1">
        <i class="fa-solid ${matchStatusIcon}"></i>
        ${matchStatusText}
    </span>
</div>


                <!-- Match Details -->
                <div class="space-y-2 mb-6 text-xs text-gray-300">

                    <div class="flex items-center gap-2">
                        <i class="fa-regular fa-calendar text-brand-500 w-4"></i>

                        <span>
                            التاريخ:
                            <strong class="text-white">
                                ${UI.formatDate(match.match_date)}
                            </strong>
                        </span>
                    </div>

                                         ${
    bookingClosed
        ? `
            <div class="w-full ${
                hasStarted
                    ? 'bg-blue-500/10 border-blue-500/20 text-blue-400'
                    : 'bg-red-500/10 border-red-500/20 text-red-400'
            } border rounded-xl px-4 py-2.5 text-xs font-bold flex items-center justify-center gap-2">
                <i class="fa-solid ${
                    hasStarted ? 'fa-play' : 'fa-lock'
                }"></i>

                <span>
                    ${
                        hasStarted
                            ? 'المباراة بدأت — الحجز مغلق'
                            : 'اكتملت المباراة — الحجز مغلق'
                    }
                </span>
            </div>
        `
        : `
            <div class="w-full bg-brand-500/10 border border-brand-500/20 text-brand-500 rounded-xl px-4 py-2.5 text-xs font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-door-open"></i>
                الحجز مفتوح — ${remainingSpots} أماكن متبقية
            </div>
        `
}
 
                    <div class="flex items-center gap-2">
                        <i class="fa-regular fa-clock text-brand-500 w-4"></i>

                        <span>
                            التوقيت:
                            <strong class="text-white">
                                ${UI.formatTime(match.start_time)}
                                -
                                ${UI.formatTime(match.end_time)}
                            </strong>
                        </span>
                    </div>


                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-money-bill-wave text-brand-500 w-4"></i>

                        <span>
                            التكلفة:
                            <strong class="text-white">
                                ${totalCost.toFixed(2)} ج.م
                            </strong>
                        </span>
                    </div>

                </div>


                <!-- Players Stats -->
                <div class="grid grid-cols-3 gap-2 mb-4">

                      <div class="bg-dark-base rounded-2xl border border-dark-border p-3 mb-4">
    <div class="flex items-center justify-between text-xs mb-2">
        <span class="text-gray-400">
            نسبة امتلاء المباراة
        </span>

        <span class="text-white font-bold">
            ${maxPlayers > 0
                ? Math.round((approvedCount / maxPlayers) * 100)
                : 0}%
        </span>
    </div>

    <div class="w-full h-2 bg-dark-hover rounded-full overflow-hidden">
        <div
            class="h-full rounded-full transition-all duration-500 ${
                isFull ? 'bg-red-500' : 'bg-brand-500'
            }"
            style="width: ${
                maxPlayers > 0
                    ? Math.min(100, (approvedCount / maxPlayers) * 100)
                    : 0
            }%"
        ></div>
    </div>
</div>

                    <div
                        class="bg-dark-base rounded-2xl border border-dark-border p-3 text-center"
                    >
                        <div class="text-[10px] text-gray-400 mb-1">
                            المقبولين
                        </div>

                        <div class="text-lg font-black text-brand-500">
                            ${approvedCount}
                        </div>
                    </div>


                    <div
                        class="bg-dark-base rounded-2xl border border-dark-border p-3 text-center"
                    >
                        <div class="text-[10px] text-gray-400 mb-1">
                            المعلق
                        </div>

                        <div class="text-lg font-black text-yellow-400">
                            ${pendingCount}
                        </div>
                    </div>


                    <div
                        class="bg-dark-base rounded-2xl border border-dark-border p-3 text-center"
                    >
                        <div class="text-[10px] text-gray-400 mb-1">
                            المتبقي
                        </div>

                        <div class="text-lg font-black ${
                            remainingSpots === 0
                                ? 'text-red-400'
                                : 'text-brand-neon'
                        }">
                            ${remainingSpots}
                        </div>
                    </div>

                </div>


                <!-- Countdown -->
                <div
                    id="admin-countdown-${match.id}"
                    data-start="${match.match_date}T${match.start_time}"
                    class="bg-brand-500/10 border border-brand-500/20 rounded-2xl p-4 mb-4"
                >

                    <div class="flex items-center gap-2 mb-2">

                        <i class="fa-solid fa-hourglass-half text-brand-500"></i>

                        <span class="text-xs font-bold text-gray-300">
                            ${hasStarted
                                ? 'المباراة بدأت'
                                : 'المباراة تبدأ خلال'}
                        </span>

                    </div>


                    <div
                        class="text-lg font-black text-white admin-countdown-value"
                    >
                        ${hasStarted
                            ? 'جارية الآن 🔥'
                            : 'جاري الحساب...'}
                    </div>

                </div>


                <!-- Approved Players -->
                <div class="bg-dark-base rounded-2xl border border-dark-border p-4 mb-4">

                    <div class="flex items-center justify-between mb-3">

                        <span class="text-xs font-bold text-gray-300">
                            <i class="fa-solid fa-users text-brand-500 ml-1"></i>
                            اللاعبين المقبولين
                        </span>

                        <span class="text-xs text-brand-500 font-bold">
                            ${approvedCount}/${maxPlayers}
                        </span>

                    </div>


                    ${
                        approvedPlayers.length > 0
                            ? `
                                <div class="flex flex-wrap gap-2">

                                    ${approvedPlayers.map(player => `

                                        <div
                                            class="inline-flex items-center gap-2 bg-brand-500/10 border border-brand-500/20 text-gray-200 px-2.5 py-1.5 rounded-lg text-xs"
                                        >

                                            <i class="fa-solid fa-user text-brand-500"></i>

                                            <span>
                                                ${escapeHtml(
                                                    player.profiles?.name || 'لاعب'
                                                )}
                                            </span>

                                        </div>

                                    `).join('')}

                                </div>
                            `
                            : `
                                <div class="text-center text-xs text-gray-500 py-2">
                                    لسه مفيش لاعبين مقبولين
                                </div>
                            `
                    }

                </div>


                <!-- Cost -->
                <div class="bg-dark-base p-4 rounded-2xl border border-dark-border mb-6">

                    <div class="flex items-center justify-between text-xs mb-1">

                        <span class="text-gray-400">
                            حصة اللاعب الحالية:
                        </span>

                        <span class="text-brand-neon font-black">
                            ${
                                approvedCount > 0
                                    ? `مقسمة على ${approvedCount}`
                                    : 'في انتظار أول لاعب'
                            }
                        </span>

                    </div>


                    <div class="flex items-baseline gap-1">

                        <span class="text-2xl font-black text-white">
                            ${costPerPlayer}
                        </span>

                        <span class="text-xs text-gray-400 font-bold">
                            جنيه / لاعب
                        </span>

                    </div>

                </div>


                <!-- Actions -->
                <div class="pt-3 border-t border-dark-border/50 space-y-2">

                    <a
    href="requests.html?match_id=${encodeURIComponent(match.id)}"
    class="w-full bg-brand-500/10 hover:bg-brand-500/20 border border-brand-500/30 text-brand-500 font-bold py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2"
>
    <i class="fa-solid fa-user-check"></i>

    <span>
        إدارة الطلبات
        ${
            pendingCount > 0
                ? `(${pendingCount} معلق)`
                : ''
        }
    </span>
</a>


                    <div class="flex items-center gap-2">

                        <button
                            data-match-id="${match.id}"
                            class="delete-match-btn flex-1 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 font-bold px-3 py-2.5 rounded-xl text-sm transition"
                        >
                            <i class="fa-solid fa-trash ml-1"></i>
                            حذف المباراة
                        </button>

                    </div>

                </div>

            </div>
        `;

    }).join('');

    setupDeleteButtons();
    startCountdowns();
}

        function startCountdowns() {

    if (countdownInterval) {
        clearInterval(countdownInterval);
    }

    function updateCountdowns() {

        document
            .querySelectorAll('[id^="admin-countdown-"]')
            .forEach(box => {

                const startValue = box.dataset.start;

                if (!startValue) {
                    return;
                }

                const startTime = new Date(startValue);
                const now = new Date();

                const diff = startTime - now;

                const value =
                    box.querySelector('.admin-countdown-value');

                if (!value) {
                    return;
                }

               if (diff <= 0) {

    value.textContent = 'المباراة بدأت 🔥';

    box.classList.remove(
        'bg-brand-500/10',
        'border-brand-500/20'
    );

    box.classList.add(
        'bg-blue-500/10',
        'border-blue-500/20'
    );

    return;
}

                const totalSeconds =
                    Math.floor(diff / 1000);

                const days =
                    Math.floor(totalSeconds / 86400);

                const hours =
                    Math.floor(
                        (totalSeconds % 86400) / 3600
                    );

                const minutes =
                    Math.floor(
                        (totalSeconds % 3600) / 60
                    );

                const seconds =
                    totalSeconds % 60;

                let text = '';

                if (days > 0) {
                    text += `${days} يوم `;
                }

                text +=
                    `${String(hours).padStart(2, '0')}:`;

                text +=
                    `${String(minutes).padStart(2, '0')}:`;

                text +=
                    `${String(seconds).padStart(2, '0')}`;

                value.textContent = text;

            });
    }

    updateCountdowns();

    countdownInterval =
        setInterval(updateCountdowns, 1000);
}
    // =========================
    // Create Match
    // =========================
    document
        .getElementById('create-match-form')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            const submitButton =
                e.target.querySelector('button[type="submit"]');

            const originalText =
                submitButton.innerHTML;

            try {

                submitButton.disabled = true;

                submitButton.innerHTML = `
                    <i class="fa-solid fa-spinner fa-spin ml-1"></i>
                    جاري الحفظ...
                `;

                const matchData = {
                    title: document
                        .getElementById('match-title')
                        .value
                        .trim(),

                    pitch_name: document
                        .getElementById('pitch-name')
                        .value
                        .trim(),

                    match_date:
                        document.getElementById('match-date').value,

                    start_time:
                        document.getElementById('start-time').value,

                    end_time:
                        document.getElementById('end-time').value,

                    total_cost:
                        Number(
                            document.getElementById('total-cost').value
                        ),

                    max_players:
                        Number(
                            document.getElementById('max-players').value
                        ),

                    notes:
                        document
                            .getElementById('notes')
                            .value
                            .trim()
                };

                // Basic validation
                if (!matchData.title) {
                    throw new Error('اكتب عنوان المباراة');
                }

                if (!matchData.pitch_name) {
                    throw new Error('اكتب اسم الملعب');
                }

                if (!matchData.match_date) {
                    throw new Error('اختار تاريخ المباراة');
                }

                if (!matchData.start_time || !matchData.end_time) {
                    throw new Error('حدد وقت البداية والنهاية');
                }

                if (matchData.end_time <= matchData.start_time) {
                    throw new Error(
                        'وقت النهاية يجب أن يكون بعد وقت البداية'
                    );
                }

                if (
                    !Number.isFinite(matchData.total_cost) ||
                    matchData.total_cost <= 0
                ) {
                    throw new Error(
                        'اكتب تكلفة صحيحة للمباراة'
                    );
                }

                if (
                    !Number.isInteger(matchData.max_players) ||
                    matchData.max_players < 2 ||
                    matchData.max_players > 22
                ) {
                    throw new Error(
                        'عدد اللاعبين يجب أن يكون بين 2 و22'
                    );
                }

                await MatchService.createMatch(matchData);

                UI.showToast(
                    'تم إنشاء المباراة ونشرها بنجاح',
                    'success'
                );

                closeModal();

                await loadMatches();

            } catch (error) {

                console.error(
                    'Error creating match:',
                    error
                );

                UI.showToast(
                    error.message ||
                    'حدث خطأ أثناء إنشاء المباراة',
                    'error'
                );

            } finally {

                submitButton.disabled = false;
                submitButton.innerHTML = originalText;

            }
        });

    // =========================
    // Delete Match
    // =========================
    function setupDeleteButtons() {

        document
            .querySelectorAll('.delete-match-btn')
            .forEach(btn => {

                btn.addEventListener('click', async function () {

                    const matchId =
                        this.dataset.matchId;

                    if (!matchId) {
                        return;
                    }

                    const confirmed = confirm(
                        'هل أنت متأكد من حذف هذه المباراة؟\n\n' +
                        'سيتم حذف المباراة نهائيًا.'
                    );

                    if (!confirmed) {
                        return;
                    }

                    const button = this;

                    try {

                        button.disabled = true;

                        button.innerHTML = `
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        `;

                        await MatchService.deleteMatch(matchId);

                        UI.showToast(
                            'تم حذف المباراة بنجاح',
                            'success'
                        );

                        await loadMatches();

                    } catch (error) {

                        console.error(
                            'Error deleting match:',
                            error
                        );

                        UI.showToast(
                            getReadableError(error),
                            'error'
                        );

                        button.disabled = false;

                        button.innerHTML = `
                            <i class="fa-solid fa-trash"></i>
                        `;
                    }

                });

            });
    }

    // =========================
    // Modal
    // =========================
    const modal =
        document.getElementById('create-match-modal');

    document
        .getElementById('create-match-btn')
        .addEventListener('click', () => {

            modal.classList.remove('hidden');

            const today =
                new Date()
                    .toISOString()
                    .split('T')[0];

            document.getElementById('match-date').value =
                today;
        });

    document
        .getElementById('close-modal-btn')
        .addEventListener('click', closeModal);

    document
        .getElementById('cancel-btn')
        .addEventListener('click', closeModal);

    function closeModal() {

        modal.classList.add('hidden');

        document
            .getElementById('create-match-form')
            .reset();
    }

    // =========================
    // Logout
    // =========================
    document
        .getElementById('logout-btn')
        .addEventListener('click', async () => {

            await Auth.signOut();

        });

    // =========================
    // Helpers
    // =========================
    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function getReadableError(error) {

        if (!error) {
            return 'حدث خطأ غير معروف';
        }

        if (error.code === '23503') {
            return 'لا يمكن حذف المباراة لأنها مرتبطة بطلبات أو مدفوعات موجودة بالفعل';
        }

        if (error.code === '42501') {
            return 'ليس لديك صلاحية لتنفيذ هذه العملية';
        }

        if (error.code === '23505') {
            return 'هذه البيانات موجودة بالفعل';
        }

        return error.message ||
            'حدث خطأ أثناء تنفيذ العملية';
    }

    // =========================
    // Initial Load
    // =========================
    loadMatches();
</script>
