<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoraMatch | إدارة المدفوعات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            neon: '#00ff87'
                        },
                        dark: {
                            base: '#0b0f17',
                            card: '#131b29',
                            border: '#1f293d',
                            hover: '#1a2436'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen bg-dark-base">
    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 glass-panel border-b border-dark-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-neon flex items-center justify-center text-black font-black text-2xl shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-wider text-white">ملعبنا<span class="text-brand-500">.</span></span>
                    <p class="text-xs text-gray-400 font-medium hidden sm:block">إدارة المدفوعات</p>
                </div>
            </div>

            <!-- Admin Menu -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-home text-brand-500"></i>
                    <span>الرئيسية</span>
                </a>
                <a href="matches.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-brand-500"></i>
                    <span>المباريات</span>
                </a>
                <a href="requests.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-user-check text-brand-500"></i>
                    <span>الطلبات</span>
                </a>
                <a href="players.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-users text-brand-500"></i>
                    <span>اللاعبين</span>
                </a>
                <a href="payments.html" class="bg-brand-500/20 border border-brand-500/50 text-brand-500 px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <span>المدفوعات</span>
                </a>
                <button id="logout-btn" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-400 px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-money-bill-wave text-brand-500"></i>
                    <span>إدارة المدفوعات</span>
                </h2>
                <p class="text-xs text-gray-400 mt-1">عرض وإدارة جميع المدفوعات في النظام</p>
            </div>

            <!-- Status Filter -->
            <div class="flex items-center gap-3">
                <select id="status-filter" class="bg-dark-card border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500 transition">
                    <option value="">جميع الحالات</option>
                    <option value="pending">معلق</option>
                    <option value="paid">مدفوع</option>
                    <option value="cancelled">ملغي</option>
                </select>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-panel rounded-2xl p-6 border border-dark-border">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-xl bg-brand-500/20 text-brand-500 flex items-center justify-center">
                        <i class="fa-solid fa-wallet text-xl"></i>
                    </div>
                    <span class="text-3xl font-black text-white" id="total-payments">0</span>
                </div>
                <h3 class="text-sm font-bold text-gray-300">إجمالي المدفوعات</h3>
            </div>

            <div class="glass-panel rounded-2xl p-6 border border-dark-border">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-xl bg-green-500/20 text-green-500 flex items-center justify-center">
                        <i class="fa-solid fa-check-circle text-xl"></i>
                    </div>
                    <span class="text-3xl font-black text-brand-500" id="paid-amount">0</span>
                </div>
                <h3 class="text-sm font-bold text-gray-300">إجمالي المدفوع (ج.م)</h3>
            </div>

            <div class="glass-panel rounded-2xl p-6 border border-dark-border">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 rounded-xl bg-yellow-500/20 text-yellow-500 flex items-center justify-center">
                        <i class="fa-solid fa-clock text-xl"></i>
                    </div>
                    <span class="text-3xl font-black text-white" id="pending-amount">0</span>
                </div>
                <h3 class="text-sm font-bold text-gray-300">إجمالي المعلق (ج.م)</h3>
            </div>
        </div>

        <!-- Payments List -->
        <div id="payments-container" class="space-y-4">
            <!-- Dynamic content -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16 glass-panel rounded-3xl border border-dark-border">
            <div class="w-16 h-16 bg-dark-hover text-gray-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-money-bill-wave font-normal"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">لا توجد مدفوعات</h3>
            <p class="text-sm text-gray-400">لا توجد مدفوعات مسجلة حالياً</p>
        </div>
    </main>

    <script type="module">
        import { Auth } from '../js/auth.js';
        import { PaymentService } from '../js/services/payment-service.js';
        import { UI } from '../js/ui.js';

        // Initialize auth
        Auth.init();

        let allPayments = [];

        // Load payments
        async function loadPayments() {
            try {
                await Auth.requireAdmin();
                
                UI.showLoading('payments-container', 'جاري تحميل المدفوعات...');
                
                allPayments = await PaymentService.getAllPayments();

                // Calculate stats
                const totalPayments = allPayments.length;
                const paidAmount = allPayments.filter(p => p.status === 'paid').reduce((sum, p) => sum + p.amount, 0);
                const pendingAmount = allPayments.filter(p => p.status === 'pending').reduce((sum, p) => sum + p.amount, 0);

                document.getElementById('total-payments').textContent = totalPayments;
                document.getElementById('paid-amount').textContent = paidAmount;
                document.getElementById('pending-amount').textContent = pendingAmount;

                renderPayments();
                
            } catch (error) {
                console.error('Error loading payments:', error);
                UI.showError('payments-container', 'حدث خطأ أثناء تحميل المدفوعات');
            }
        }

        // Render payments
        function renderPayments() {
            const container = document.getElementById('payments-container');
            const emptyState = document.getElementById('empty-state');
            const statusFilter = document.getElementById('status-filter').value;

            let filteredPayments = allPayments;
            if (statusFilter) {
                filteredPayments = allPayments.filter(p => p.status === statusFilter);
            }

            // Sort by date descending
            filteredPayments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (filteredPayments.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filteredPayments.map(payment => `
                <div class="glass-panel rounded-2xl p-6 border border-dark-border flex items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-brand-500/20 text-brand-500 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-money-bill"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-white">${payment.profiles?.name || 'لاعب'}</h4>
                            <span class="text-xs text-gray-400">${payment.profiles?.email || ''}</span>
                            <div class="mt-1 text-xs text-gray-300">
                                <span class="font-bold">${payment.matches?.title || 'مباراة'}</span> - ${payment.matches?.match_date || ''}
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="text-left">
                            <div class="text-lg font-black text-white">${payment.amount} ج.م</div>
                            <span class="text-xs text-gray-400">${UI.formatDate(payment.created_at)}</span>
                        </div>

                        <span class="px-3 py-1 rounded-full text-xs font-bold ${
                            payment.status === 'paid' ? 'bg-brand-500/20 text-brand-500 border border-brand-500/30' :
                            payment.status === 'cancelled' ? 'bg-red-500/20 text-red-400 border border-red-500/30' :
                            'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30'
                        }">
                            ${payment.status === 'paid' ? 'مدفوع' : payment.status === 'cancelled' ? 'ملغي' : 'معلق'}
                        </span>

                        ${payment.status === 'pending' ? `
                            <div class="flex items-center gap-2">
                                <button data-payment-id="${payment.id}" class="mark-paid-btn bg-brand-500/20 hover:bg-brand-500 hover:text-black text-brand-500 border border-brand-500/30 text-xs font-bold px-3 py-1.5 rounded-xl transition">
                                    <i class="fa-solid fa-check"></i> تسديد
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            setupPaymentButtons();
        }

        // Setup payment buttons
        function setupPaymentButtons() {
            document.querySelectorAll('.mark-paid-btn').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const paymentId = this.dataset.paymentId;
                    if (!confirm('هل أنت متأكد من تسجيل هذه المدفوعة كمدفوعة؟')) return;
                    
                    try {
                        await PaymentService.updatePaymentStatus(paymentId, 'paid');
                        UI.showToast('تم تسجيل المدفوعة بنجاح', 'success');
                        await loadPayments();
                    } catch (error) {
                        console.error('Error marking payment as paid:', error);
                        UI.showToast('حدث خطأ أثناء تسجيل المدفوعة', 'error');
                    }
                });
            });
        }

        // Filter handler
        document.getElementById('status-filter').addEventListener('change', renderPayments);

        // Logout handler
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await Auth.signOut();
        });

        // Load payments on page load
        loadPayments();
    </script>
</body>
</html>
