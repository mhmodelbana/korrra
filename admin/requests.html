<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoraMatch | إدارة الطلبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            neon: '#00ff87'
                        },
                        dark: {
                            base: '#0b0f17',
                            card: '#131b29',
                            border: '#1f293d',
                            hover: '#1a2436'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-screen bg-dark-base">
    <!-- Navigation Bar -->
    <header class="sticky top-0 z-40 glass-panel border-b border-dark-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-neon flex items-center justify-center text-black font-black text-2xl shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <span class="text-2xl font-black tracking-wider text-white">ملعبنا<span class="text-brand-500">.</span></span>
                    <p class="text-xs text-gray-400 font-medium hidden sm:block">إدارة طلبات الانضمام</p>
                </div>
            </div>

            <!-- Admin Menu -->
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-home text-brand-500"></i>
                    <span>الرئيسية</span>
                </a>
                <a href="matches.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-brand-500"></i>
                    <span>المباريات</span>
                </a>
                <a href="players.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-users text-brand-500"></i>
                    <span>اللاعبين</span>
                </a>
                <a href="payments.html" class="bg-dark-card hover:bg-dark-hover border border-dark-border text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-money-bill-wave text-brand-500"></i>
                    <span>المدفوعات</span>
                </a>
                <button id="logout-btn" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/30 text-red-400 px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-check text-brand-500"></i>
                    <span>إدارة طلبات الانضمام</span>
                </h2>
                <p class="text-xs text-gray-400 mt-1">قبول أو رفض طلبات الانضمام للمباريات</p>
            </div>

            <!-- Match Filter -->
            <div class="flex items-center gap-3">
                <select id="match-filter" class="bg-dark-card border border-dark-border text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-brand-500 transition">
                    <option value="">جميع المباريات</option>
                    <!-- Dynamic options -->
                </select>
            </div>
        </div>

        <!-- Requests List -->
        <div id="requests-container" class="space-y-4">
            <!-- Dynamic content -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16 glass-panel rounded-3xl border border-dark-border">
            <div class="w-16 h-16 bg-dark-hover text-gray-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-inbox font-normal"></i>
            </div>
            <h3 class="text-lg font-bold text-white mb-1">لا توجد طلبات</h3>
            <p class="text-sm text-gray-400">لا توجد طلبات انضمام معلقة حالياً</p>
        </div>
    </main>

    <script type="module">
    import { Auth } from '../js/auth.js';
    import { MatchService } from '../js/services/match-service.js';
    import { RequestService } from '../js/services/request-service.js';
    import { UI } from '../js/ui.js';

    Auth.init();

    let allMatches = [];
    let allRequests = [];

    // =========================
    // Load Data
    // =========================
    async function loadData() {
        try {
            const isAdmin = await Auth.requireAdmin();

            if (!isAdmin) {
                return;
            }

            UI.showLoading(
                'requests-container',
                'جاري تحميل الطلبات...'
            );

            // Load matches
            allMatches = await MatchService.getAllMatches();

            // Load filter
            renderMatchFilter();

            // Load requests
            allRequests = await RequestService.getAllRequests();

            renderRequests();

        } catch (error) {

            console.error(
                'Error loading requests:',
                error
            );

            UI.showError(
                'requests-container',
                getReadableError(error)
            );
        }
    }

    // =========================
    // Match Filter
    // =========================
    function renderMatchFilter() {

        const matchFilter =
            document.getElementById('match-filter');

        const currentValue =
            matchFilter.value;

        matchFilter.innerHTML = `
            <option value="">جميع المباريات</option>

            ${allMatches.map(match => `
                <option value="${escapeHtml(match.id)}">
                    ${escapeHtml(match.title)}
                </option>
            `).join('')}
        `;

        // Preserve selected match
        if (
            currentValue &&
            allMatches.some(
                match => match.id === currentValue
            )
        ) {
            matchFilter.value = currentValue;
        }
    }

    // =========================
    // Render Requests
    // =========================
    function renderRequests() {

        const container =
            document.getElementById('requests-container');

        const emptyState =
            document.getElementById('empty-state');

        const matchFilter =
            document.getElementById('match-filter').value;

        let filteredRequests = [...allRequests];

        if (matchFilter) {

            filteredRequests =
                filteredRequests.filter(
                    request =>
                        request.match_id === matchFilter
                );
        }

        // Pending first
        filteredRequests.sort((a, b) => {

            if (
                a.status === 'pending' &&
                b.status !== 'pending'
            ) {
                return -1;
            }

            if (
                a.status !== 'pending' &&
                b.status === 'pending'
            ) {
                return 1;
            }

            return (
                new Date(b.created_at) -
                new Date(a.created_at)
            );
        });

        if (filteredRequests.length === 0) {

            container.innerHTML = '';

            emptyState.classList.remove('hidden');

            return;
        }

        emptyState.classList.add('hidden');

        container.innerHTML =
            filteredRequests.map(request => {

                const playerName =
                    request.profiles?.name ||
                    'لاعب';

                const playerEmail =
                    request.profiles?.email ||
                    '';

                const matchTitle =
                    request.matches?.title ||
                    'مباراة';

                const matchDate =
                    request.matches?.match_date ||
                    '';

                const statusText =
                    request.status === 'approved'
                        ? 'مقبول'
                        : request.status === 'rejected'
                            ? 'مرفوض'
                            : 'معلق';

                const statusClass =
                    request.status === 'approved'
                        ? 'bg-brand-500/20 text-brand-500 border border-brand-500/30'
                        : request.status === 'rejected'
                            ? 'bg-red-500/20 text-red-400 border border-red-500/30'
                            : 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30';

                return `
                    <div
                        class="glass-panel rounded-2xl p-6 border border-dark-border flex flex-col lg:flex-row items-start lg:items-center justify-between gap-5"
                    >

                        <!-- Player -->
                        <div class="flex items-center gap-4">

                            <div
                                class="w-12 h-12 rounded-full bg-brand-500/20 text-brand-500 flex items-center justify-center font-bold shrink-0"
                            >
                                <i class="fa-solid fa-user"></i>
                            </div>

                            <div>

                                <h4 class="font-bold text-white">
                                    ${escapeHtml(playerName)}
                                </h4>

                                <span class="text-xs text-gray-400">
                                    ${escapeHtml(playerEmail)}
                                </span>

                                <div class="mt-1 text-xs text-gray-300">

                                    <span class="font-bold text-white">
                                        ${escapeHtml(matchTitle)}
                                    </span>

                                    <span class="text-gray-500">
                                        -
                                    </span>

                                    <span>
                                        ${escapeHtml(matchDate)}
                                    </span>

                                </div>

                            </div>

                        </div>

                        <!-- Status + Actions -->
                        <div class="flex items-center gap-3 w-full lg:w-auto">

                            <span
                                class="px-3 py-1 rounded-full text-xs font-bold ${statusClass}"
                            >
                                ${statusText}
                            </span>

                            ${
                                request.status === 'pending'
                                    ? `
                                        <div class="flex items-center gap-2 mr-auto lg:mr-0">

                                            <button
                                                data-request-id="${escapeHtml(request.id)}"
                                                class="approve-request-btn bg-brand-500/20 hover:bg-brand-500 hover:text-black text-brand-500 border border-brand-500/30 text-xs font-bold px-3 py-1.5 rounded-xl transition"
                                            >
                                                <i class="fa-solid fa-check"></i>
                                                قبول
                                            </button>

                                            <button
                                                data-request-id="${escapeHtml(request.id)}"
                                                class="reject-request-btn bg-red-500/20 hover:bg-red-500 hover:text-white text-red-400 border border-red-500/30 text-xs font-bold px-3 py-1.5 rounded-xl transition"
                                            >
                                                <i class="fa-solid fa-xmark"></i>
                                                رفض
                                            </button>

                                        </div>
                                    `
                                    : ''
                            }

                        </div>

                    </div>
                `;

            }).join('');

        setupRequestButtons();
    }

    // =========================
    // Request Buttons
    // =========================
    function setupRequestButtons() {

        document
            .querySelectorAll('.approve-request-btn')
            .forEach(button => {

                button.addEventListener(
                    'click',
                    async function () {

                        const requestId =
                            this.dataset.requestId;

                        if (!requestId) {
                            return;
                        }

                        const originalHTML =
                            this.innerHTML;

                        try {

                            this.disabled = true;

                            this.innerHTML = `
                                <i class="fa-solid fa-spinner fa-spin"></i>
                                جاري...
                            `;

                            await RequestService.approveRequest(
                                requestId
                            );

                            UI.showToast(
                                'تم قبول الطلب بنجاح',
                                'success'
                            );

                            await loadData();

                        } catch (error) {

                            console.error(
                                'Error approving request:',
                                error
                            );

                            UI.showToast(
                                getReadableError(error),
                                'error'
                            );

                            this.disabled = false;
                            this.innerHTML =
                                originalHTML;
                        }
                    }
                );
            });

        document
            .querySelectorAll('.reject-request-btn')
            .forEach(button => {

                button.addEventListener(
                    'click',
                    async function () {

                        const requestId =
                            this.dataset.requestId;

                        if (!requestId) {
                            return;
                        }

                        const confirmed = confirm(
                            'هل أنت متأكد من رفض طلب الانضمام؟'
                        );

                        if (!confirmed) {
                            return;
                        }

                        const originalHTML =
                            this.innerHTML;

                        try {

                            this.disabled = true;

                            this.innerHTML = `
                                <i class="fa-solid fa-spinner fa-spin"></i>
                                جاري...
                            `;

                            await RequestService.rejectRequest(
                                requestId
                            );

                            UI.showToast(
                                'تم رفض الطلب',
                                'success'
                            );

                            await loadData();

                        } catch (error) {

                            console.error(
                                'Error rejecting request:',
                                error
                            );

                            UI.showToast(
                                getReadableError(error),
                                'error'
                            );

                            this.disabled = false;
                            this.innerHTML =
                                originalHTML;
                        }
                    }
                );
            });
    }

    // =========================
    // Filter
    // =========================
    document
        .getElementById('match-filter')
        .addEventListener(
            'change',
            renderRequests
        );

    // =========================
    // Logout
    // =========================
    document
        .getElementById('logout-btn')
        .addEventListener(
            'click',
            async () => {
                await Auth.signOut();
            }
        );

    // =========================
    // Helpers
    // =========================
    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function getReadableError(error) {

        if (!error) {
            return 'حدث خطأ غير معروف';
        }

        if (error.code === '42501') {
            return 'ليس لديك صلاحية لتنفيذ هذه العملية';
        }

        if (error.code === '23503') {
            return 'البيانات مرتبطة بسجل آخر ولا يمكن تنفيذ العملية';
        }

        if (error.code === '23505') {
            return 'هذا الطلب موجود بالفعل';
        }

        return (
            error.message ||
            'حدث خطأ أثناء تنفيذ العملية'
        );
    }

    // =========================
    // Initial Load
    // =========================
    loadData();
</script>
</body>
</html>
