<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoraMatch | تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            neon: '#00ff87'
                        },
                        dark: {
                            base: '#0b0f17',
                            card: '#131b29',
                            border: '#1f293d',
                            hover: '#1a2436'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-dark-base">
    <div class="max-w-md w-full mx-4">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-brand-600 to-brand-neon flex items-center justify-center text-black font-black text-4xl shadow-lg shadow-brand-500/20 mx-auto mb-4">
                <i class="fa-solid fa-futbol"></i>
            </div>
            <h1 class="text-3xl font-black text-white mb-2">ملعبنا<span class="text-brand-500">.</span></h1>
            <p class="text-gray-400 text-sm">سجل دخولك لحجز المباريات</p>
        </div>

        <!-- Login Form -->
        <div class="glass-panel rounded-3xl p-8 border border-dark-border">
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2">البريد الإلكتروني</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute right-4 top-3.5 text-gray-500"></i>
                        <input type="email" id="email" required placeholder="example@email.com" 
                            class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl pr-11 pl-4 py-3 focus:outline-none focus:border-brand-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2">كلمة المرور</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute right-4 top-3.5 text-gray-500"></i>
                        <input type="password" id="password" required placeholder="••••••••" 
                            class="w-full bg-dark-base border border-dark-border text-white text-sm rounded-xl pr-11 pl-4 py-3 focus:outline-none focus:border-brand-500 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-400 text-black font-extrabold py-3 rounded-xl text-sm transition shadow-lg shadow-brand-500/20">
                    تسجيل الدخول
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-400 text-sm">
                    ليس لديك حساب؟ 
                    <a href="register.html" class="text-brand-500 hover:text-brand-400 font-bold">إنشاء حساب جديد</a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-xs text-gray-500">
            <p>نظام ملعبنا © 2026 - جميع الحقوق محفوظة</p>
        </div>
    </div>

    <script type="module">
        import { Auth } from './js/auth.js';

        const loginForm = document.getElementById('login-form');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري تسجيل الدخول...';

            try {
                await Auth.signIn(email, password);
            } catch (error) {
                console.error('Login error:', error);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
